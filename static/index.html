<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>电网恢复调度</title><style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}pre{background:#f3f5f7;padding:16px;overflow:auto}button{padding:8px 14px}input{padding:8px;width:90px}</style><h1>电网事故应急与恢复调度</h1><p>停运事件、安全约束恢复计划、重要用户、离线上报合并、现场纠错、异常遥测隔离和状态发布。</p><button onclick="loadState()">刷新状态</button><pre id="state">加载中...</pre><h2>计划详情（含更正链与阻断原因）</h2><input id="pid" value="1" placeholder="计划ID"><button onclick="loadPlan()">查看详情</button><pre id="detail">尚未加载</pre><script>async function loadState(){state.textContent=JSON.stringify(await (await fetch('/api/state')).json(),null,2)}async function loadPlan(){const r=await fetch('/api/plans/'+pid.value);detail.textContent=JSON.stringify(await r.json(),null,2)}loadState()</script></html>
